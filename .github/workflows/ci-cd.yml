name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '30 21 * * 6'
  repository_dispatch:
    types: [website-updated]
  workflow_dispatch:

jobs:
  # ==========================================================
  # 1. BUILD & TEST JOB
  # ==========================================================
  build-and-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Syntax & Import Check
      run: |
        python -m py_compile main.py scrape_and_embed.py

    # Optional CD Step: Sirf tab chalega agar RENDER_DEPLOY_HOOK secret defined ho
    - name: Trigger Render Deployment (CD)
      if: env.RENDER_HOOK != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
      env:
        RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        echo "Triggering Deployment Hook..."
        curl -X POST "$RENDER_HOOK"

  # ==========================================================
  # 2. KNOWLEDGE BASE AUTO-SYNC
  # ==========================================================
  knowledge-auto-sync:
    if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Website Re-scraping on Live Render Server
      run: |
        echo "⏰ Triggering Knowledge Auto-Sync on Live Render Server..."
        curl -X POST "https://aehsas-foundation-chatbot.onrender.com/webhook/sync-knowledge" \
             -F "secret_token=aehsas_admin_123"