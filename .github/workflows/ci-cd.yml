name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  # ⏰ Weekly Trigger: Har Sunday raat 3:00 AM IST (Saturday 21:30 UTC)
  schedule:
    - cron: '30 21 * * 6'

jobs:
  # ==========================================================
  # 1. BUILD & TEST JOB (Runs on Code Push / PR)
  # ==========================================================
  build-and-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build Docker Image Test
      run: |
        docker build -t aehsas-chatbot:latest .

    # --- 🚀 CD Step (Continuous Deployment) ---
    - name: Trigger Render Deployment (CD)
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
      run: |
        echo "CI Passed! Triggering Deployment..."
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  # ==========================================================
  # 2. WEEKLY KNOWLEDGE BASE AUTO-SYNC (Runs Every Sunday 3 AM)
  # ==========================================================
  weekly-auto-sync:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Website Re-scraping & Vector DB Sync
      run: |
        echo "⏰ Triggering Weekly Knowledge Auto-Sync on Live Render Server..."
        curl -X POST "https://aehsas-foundation-chatbot.onrender.com/webhook/sync-knowledge" \
             -F "secret_token=aehsas_admin_123"